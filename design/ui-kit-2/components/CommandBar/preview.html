<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:20px}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:36px;padding:0 16px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:var(--surface);background:var(--surface);color:var(--info)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);height:22px;padding:0 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.danger{background:var(--danger-soft);color:var(--danger)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.none{background:var(--surface-raised);color:var(--text-muted);border:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.mono{font-family:var(--font-mono);font-size:13px}
.muted{color:var(--text-muted)}
.label{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
svg.ik{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
body{padding:0}
.cmd{background:var(--surface-raised);border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:var(--space-1);padding:0 var(--space-3);border-bottom:1px solid var(--border);background:var(--surface)}
.tab{height:32px;padding:0 var(--space-3);border:0;border-bottom:2px solid var(--surface);background:var(--surface);color:var(--text-muted);font:inherit;cursor:pointer}
.tab.on{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.grupper{display:flex;align-items:stretch;gap:var(--space-3);padding:var(--space-2) var(--space-3) var(--space-1);flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:2px;padding-right:var(--space-3);border-right:1px solid var(--border)}
.grp:last-child{border-right:0}
.grp .kn{display:flex;gap:2px}
.grp .cap{font-size:11px;line-height:14px;color:var(--text-muted);text-align:center}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px;height:54px;padding:0 var(--space-2);border:1px solid var(--surface-raised);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--text);font:inherit;font-size:12px;line-height:14px;cursor:pointer}
.cb:hover{background:var(--surface);border-color:var(--border)}
.cb svg{width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cb.pri svg{stroke:var(--accent)}.cb.pri{font-weight:600}
.cb[disabled]{opacity:.5;cursor:default}
.cb:focus-visible,.tab:focus-visible,.vs:focus-visible,.tr:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
</style>
</head>
<body>
<div class="cmd">
  <div class="tabs" role="tablist"><button class="tab on" role="tab" aria-selected="true" type="button">Start</button><button class="tab" role="tab" aria-selected="false" type="button">Vis</button></div>
  <div class="grupper">
    <div class="grp"><div class="kn"><button type="button" class="cb "><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M9 5H6v15h12V5h-3"></path></svg>Indsæt</button><button type="button" class="cb "><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>Åbn fil</button></div><span class="cap">Tekst</span></div>
    <div class="grp"><div class="kn"><button type="button" class="cb "><svg class="" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>Analysér</button><button type="button" class="cb pri"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>Gem og maskér</button><button type="button" class="cb "><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="1"></rect><rect x="13" y="5" width="8" height="14" rx="1"></rect></svg>Før og efter</button></div><span class="cap">Maskering</span></div>
    <div class="grp"><div class="kn"><button type="button" class="cb " disabled><svg class="" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Kopiér</button><button type="button" class="cb " disabled><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Kvittering</button></div><span class="cap">Resultat</span></div>
  </div>
</div>
</body>
</html>
