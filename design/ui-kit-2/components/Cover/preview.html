<!-- @dsCard height=288 -->
<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg);font-family:var(--font-sans)}
.cover svg{position:absolute;inset:0;display:block}
.slab{fill:var(--rail-active)}
.brand{fill:var(--accent);rx:var(--radius-lg)}
.soft{fill:var(--accent-soft);rx:var(--radius-md)}
.info{fill:var(--info);rx:var(--radius-md)}
.warn{fill:var(--warn);rx:var(--radius-md)}
.tile{fill:var(--bg);rx:var(--radius-sm)}
.tekst{position:absolute;left:var(--space-8);bottom:var(--space-6);width:440px;display:flex;flex-direction:column;gap:var(--space-4)}
.navn{margin:0;color:var(--text);font-weight:700;font-size:80px;line-height:.95;letter-spacing:-.03em}
.tag{margin:0;color:var(--text-muted);font-size:14px;line-height:20px}
</style>
</head>
<body>
<div class="cover">
<!-- Udledning
blokke: rail-active 128x288 (søjle) · accent 320x128 · accent-soft 160x80 · info 64x80 · warn 64x32
opstilling: én høj søjle med satellitter; accent og warn går ud over højre kant
mønster: fliser skåret med radius-sm, nogle slået sammen to-brede, fordi kittet er modulært og tæt (tabelrækker, statusfliser); fliserne er bg skåret ud af accent
trin og radier: flise 24 px med space-2 imellem (pitch 32 = space-8); afstande space-4; radius-sm, radius-md, radius-lg
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="slab" x="528" y="0" width="128" height="288"></rect>
  <rect class="brand" x="672" y="32" width="320" height="128"></rect>
  <rect class="soft" x="672" y="176" width="160" height="80"></rect>
  <rect class="info" x="848" y="176" width="64" height="80"></rect>
  <rect class="warn" x="928" y="176" width="64" height="32"></rect>
  <rect class="tile" x="692" y="52" width="24" height="24"></rect>
  <rect class="tile" x="724" y="52" width="56" height="24"></rect>
  <rect class="tile" x="788" y="52" width="24" height="24"></rect>
  <rect class="tile" x="820" y="52" width="24" height="24"></rect>
  <rect class="tile" x="852" y="52" width="56" height="24"></rect>
  <rect class="tile" x="916" y="52" width="24" height="24"></rect>
  <rect class="tile" x="692" y="84" width="56" height="24"></rect>
  <rect class="tile" x="756" y="84" width="24" height="24"></rect>
  <rect class="tile" x="788" y="84" width="24" height="24"></rect>
  <rect class="tile" x="820" y="84" width="56" height="24"></rect>
  <rect class="tile" x="884" y="84" width="24" height="24"></rect>
  <rect class="tile" x="916" y="84" width="24" height="24"></rect>
  <rect class="tile" x="692" y="116" width="24" height="24"></rect>
  <rect class="tile" x="724" y="116" width="24" height="24"></rect>
  <rect class="tile" x="756" y="116" width="56" height="24"></rect>
  <rect class="tile" x="820" y="116" width="24" height="24"></rect>
  <rect class="tile" x="852" y="116" width="24" height="24"></rect>
  <rect class="tile" x="884" y="116" width="56" height="24"></rect>
</svg>
<div class="tekst">
  <p class="navn">Wi24rd UI Kit 2</p>
  <p class="tag">Ro, klarhed og ét tydeligt næste skridt.</p>
</div>
</div>
</body>
</html>
