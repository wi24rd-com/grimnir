<!doctype html>
<html lang="da" data-tema="system" data-kit-praefiks="grimnir" data-laast>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi24rd Grimnir — Mask. Share. Restore.</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/kit.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/tema.js"></script>
<script src="assets/sprogmotor.js" defer></script>
<script src="assets/sprog.js" defer></script>
<script src="assets/kit.js" defer></script>
<script src="assets/app.js" defer></script>
<script src="assets/laas.js" defer></script>
<script src="assets/maskering.js" defer></script>
<script src="assets/sager.js" defer></script>
<script src="assets/ordbog.js" defer></script>
<script src="assets/indstillinger.js" defer></script>
</head>
<body>
<div class="vindue" id="vindue">
  <header class="titel" data-tauri-drag-region="deep">
    <span class="mrk" aria-hidden="true">G</span>
    <b data-t="appNavn">Wi24rd Grimnir</b>
    <span class="slogan-plads"><span class="slogan" data-t="slogan">Mask. Share. Restore.</span></span>
    <span class="hoejre">
      <span id="sag" data-t="ingenSag">Ingen sag åben</span>
      <button type="button" class="rk" id="sag-knap" hidden data-t="midlertidigSag" data-v="0" data-t-aria="ariaSagKnap"></button>
      <button type="button" class="rk" id="aabn-indst" data-t-aria="aabnIndst" data-t-title="aabnIndstTitel"></button>
    </span>
  </header>

  <div class="laas-banner" id="laas-banner"></div>

  <div id="baand"></div>

  <div class="midte">
    <nav class="nav" data-t-aria="navAria">
      <div class="navdele" id="navdele"></div>
      <div id="skift"></div>
    </nav>
    <main class="arb" id="arb">
      <section class="laasskaerm" id="laas" aria-labelledby="laas-h" aria-describedby="laas-p">
        <span class="laas-mrk" aria-hidden="true">G</span>
        <h2 id="laas-h" data-t="laasH">Grimnir er låst</h2>
        <p id="laas-p" data-t="laasP"></p>
        <div class="laas-knapper">
          <button type="button" class="btn" id="laas-afslut" data-t="kAfslut" data-t-aria="ariaAfslut">Afslut</button>
          <button type="button" class="btn primary" id="laas-op" data-t="kLaasOp" data-t-aria="ariaLaasOp">Lås op</button>
        </div>
        <p class="laas-besked" id="laas-besked" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <footer class="fodl">
    <span id="fod-venstre"></span>
    <span class="h">
      <span id="fod-lokalt"><span data-t="kunLokalt">Kun på denne maskine</span></span>
      <span id="fod-version" data-t="version" data-v="…"></span>
      <span id="fod-kerne" data-t="kerne" data-v="…"></span>
    </span>
  </footer>
</div>

<dialog class="dlg dlg-bred" id="dlg-indst" aria-labelledby="dlg-indst-h">
  <h2 id="dlg-indst-h" data-t="indstH">Indstillinger</h2>
  <!-- V-KITBRUG.1: tema, sprog og tekststørrelse (kittets radiogruppe), afkrydsningerne og valglisterne bygges af
       kittet i indstillinger.js (Kit.radiogruppe, Kit.afkrydsning, Kit.valgliste) med de samme id'er og tekster. -->
  <div class="indst" id="indst-valg">
    <fieldset class="valg lodret" id="indst-nye">
      <legend class="label" data-t="indstNyeSager">Nye sager</legend>
    </fieldset>
    <fieldset class="valg lodret" id="indst-laasvalg">
      <legend class="label" data-t="indstLaas">Lås</legend>
    </fieldset>
    <fieldset class="valg lodret">
      <legend class="label" data-t="indstGuide">Første start</legend>
      <span class="hj" data-t="hjGuide"></span>
      <div><button type="button" class="btn" id="indst-guide" data-t="visGuideIgen">Vis guiden igen</button></div>
    </fieldset>
  </div>
  <p class="dlg-fejl" id="indst-fejl" role="alert"></p>
  <div class="dlg-knapper"><button type="button" class="btn" data-luk data-t="luk">Luk</button></div>
</dialog>

<!-- V-KITBRUG.1 N4: Om, Ny sag, Omdøb, Udløb, Slet sag, Gem den midlertidige sag?, Fjern post, Gem med de rigtige
     værdier? og Start forfra er kittets dialog (Kit.dialog og Kit.bekraeft) og bygges i app.js, sager.js, ordbog.js og maskering.js. -->
<dialog class="dlg" id="dlg-sag" aria-labelledby="dlg-sag-h">
  <h2 id="dlg-sag-h" data-t="sagH">Midlertidig sag</h2>
  <p id="dlg-sag-p" data-t="sagP" data-v="0"></p>
  <fieldset class="valg lodret sag-valg" id="sag-valg">
    <legend class="label" data-t="sagValgH">Valg for denne sag</legend>
    <!-- sag-fremmede og sag-oktet: kittets afkrydsning (sager.js) -->
    <span class="hj" id="sag-valg-hj" data-t="sagValgNye"></span>
  </fieldset>
  <p class="dlg-fejl" id="sag-valg-fejl" role="alert"></p>
  <div class="dlg-knapper">
    <button type="button" class="btn" data-luk data-t="luk">Luk</button>
    <button type="button" class="btn danger" id="sag-nulstil" data-t="nulstilSag">Nulstil sagen</button>
    <button type="button" class="btn primary" id="sag-gem-som" data-t="gemSomSag">Gem som sag</button>
    <button type="button" class="btn" id="sag-skift" data-t="skiftSag" hidden>Skift sag</button>
    <button type="button" class="btn primary" id="sag-luk" data-t="lukSag" hidden>Luk sag</button>
  </div>
</dialog>

<dialog class="dlg" id="dlg-opost" aria-labelledby="dlg-opost-h">
  <h2 id="dlg-opost-h" data-t="opostTilfoejH">Tilføj post</h2>
  <p id="dlg-opost-p" data-t="opostP" hidden></p>
  <div class="dlg-felter">
    <!-- opost-type: kittets valgliste (ordbog.js) -->
    <div class="felt">
      <label class="label" for="opost-vaerdi" data-t="feltVaerdi">Værdi eller mønster</label>
      <input id="opost-vaerdi" class="mono" type="text" maxlength="253" data-t-aria="feltVaerdi" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-describedby="opost-vaerdi-fejl opost-vaerdi-adv">
      <span class="hj fejltekst" id="opost-vaerdi-fejl"></span>
      <span class="raekkeadv" id="opost-vaerdi-adv" role="status" hidden></span>
    </div>
    <div class="felt">
      <label class="label" for="opost-note" data-t="feltNote">Note (valgfri)</label>
      <input id="opost-note" type="text" maxlength="200" data-t-aria="feltNote" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-describedby="opost-note-fejl">
      <span class="hj fejltekst" id="opost-note-fejl"></span>
    </div>
  </div>
  <p class="dlg-fejl" id="opost-fejl" role="alert"></p>
  <div class="dlg-knapper">
    <button type="button" class="btn" data-luk data-t="annuller">Annullér</button>
    <button type="button" class="btn primary" id="opost-ok" data-t="kTilfoejPost">Tilføj post</button>
  </div>
</dialog>

<dialog class="dlg dlg-bred" id="dlg-proev" aria-labelledby="dlg-proev-h">
  <h2 id="dlg-proev-h" data-t="proevH">Prøv ordbogen på en tekst</h2>
  <p data-t="proevP"></p>
  <div class="felt">
    <label class="label" for="proev-tekst" data-t="feltTekst">Tekst</label>
    <textarea id="proev-tekst" class="mono" rows="6" data-t-aria="feltTekst" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  </div>
  <div class="proev-svar" id="proev-svar" role="status"></div>
  <div class="dlg-knapper">
    <button type="button" class="btn" data-luk data-t="luk">Luk</button>
    <button type="button" class="btn primary" id="proev-ok" data-t="kProevKoer">Prøv</button>
  </div>
</dialog>

<dialog class="dlg dlg-guide" id="dlg-guide" aria-labelledby="guide-h">
  <div id="guide"></div>
</dialog>
</body>
</html>
