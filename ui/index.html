<!doctype html>
<html lang="da" data-tema="system" data-kit-praefiks="grimnir" data-laast>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi24rd Grimnir — Mask. Share. Restore.</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/kit.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/tema.js"></script>
<script src="assets/sprogmotor.js" defer></script>
<script src="assets/sprog.js" defer></script>
<script src="assets/kit.js" defer></script>
<script src="assets/app.js" defer></script>
<script src="assets/laas.js" defer></script>
<script src="assets/maskering.js" defer></script>
<script src="assets/sager.js" defer></script>
<script src="assets/ordbog.js" defer></script>
<script src="assets/indstillinger.js" defer></script>
</head>
<body>
<div class="vindue" id="vindue">
  <header class="titel" data-tauri-drag-region="deep">
    <span class="mrk" aria-hidden="true">G</span>
    <b data-t="appNavn">Wi24rd Grimnir</b>
    <span class="slogan-plads"><span class="slogan" data-t="slogan">Mask. Share. Restore.</span></span>
    <span class="hoejre">
      <span id="sag" data-t="ingenSag">Ingen sag åben</span>
      <button type="button" class="rk" id="sag-knap" hidden data-t="midlertidigSag" data-v="0" data-t-aria="ariaSagKnap"></button>
      <!-- V-OPBYG.1 N7: Vejledning (beder styresystemet åbne vejledningen i browseren; virker også låst) og Lås (låser nu). -->
      <button type="button" class="rk rk-ord" id="vejledning" data-t="kVejledning" data-t-aria="ariaVejledning" data-t-title="titelVejledning"></button>
      <button type="button" class="rk rk-ord" id="laas-nu" data-t="kLaasNu" data-t-aria="ariaLaasNu"></button>
      <button type="button" class="rk" id="aabn-indst" data-t-aria="aabnIndst" data-t-title="aabnIndstTitel"></button>
    </span>
  </header>

  <div class="laas-banner" id="laas-banner"></div>

  <!-- V-OPBYG.1 (D27, kit 2.8.0): ét bånd; visningerne er båndets egne faner øverst i det (Ordbog for sig til højre), og
       resten er den valgte visnings kommandoer (app.js). -->
  <div id="baand"></div>

  <div class="midte">
    <nav class="nav" data-t-aria="navAria">
      <div class="navdele" id="navdele"></div>
      <!-- V-OPBYG.1 N4 (D27): den aktuelle sag i alle visninger (sager.js udfylder). Skjult, mens der er låst (app.css). -->
      <section class="sagdel" id="sagdel" aria-labelledby="sagdel-h">
        <h3 id="sagdel-h" data-t="aktuelSag">Aktuel sag</h3>
        <p class="sagdel-navn" id="sagdel-navn" data-t="midlertidigSagNavn"></p>
        <p class="sagdel-status" id="sagdel-status" data-t="sagIkkeGemt"></p>
        <button type="button" class="btn mini sagdel-gem" id="sagdel-gem" data-t="kGemSomSag"></button>
        <button type="button" class="tr sagdel-erst" id="sagdel-erst" data-t-aria="ariaGemteErstatninger" data-v="0" aria-disabled="true" data-t-title="hvorforIngenErstatninger"><span data-t="gemteErstatninger"></span><span class="ant" id="sagdel-antal">0</span></button>
      </section>
      <p class="sagdel-lokalt" data-t="altLokalt">Alt behandles på denne maskine</p>
    </nav>
    <main class="arb" id="arb">
      <section class="laasskaerm" id="laas" aria-labelledby="laas-h" aria-describedby="laas-p">
        <span class="laas-mrk" aria-hidden="true">G</span>
        <h2 id="laas-h" data-t="laasH">Grimnir er låst</h2>
        <p id="laas-p" data-t="laasP"></p>
        <div class="laas-knapper">
          <button type="button" class="btn" id="laas-afslut" data-t="kAfslut" data-t-aria="ariaAfslut">Afslut</button>
          <button type="button" class="btn primary" id="laas-op" data-t="kLaasOp" data-t-aria="ariaLaasOp">Lås op</button>
        </div>
        <p class="laas-besked" id="laas-besked" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <footer class="fodl">
    <span id="fod-venstre"></span>
    <span class="h">
      <span id="fod-lokalt"><span data-t="kunLokalt">Kun på denne maskine</span></span>
      <span id="fod-version" data-t="version" data-v="…"></span>
      <span id="fod-kerne" data-t="kerne" data-v="…"></span>
    </span>
  </footer>
</div>

<!-- V-KITBRUG.2 N1: alle dialoger er kittets (Kit.dialog og Kit.bekraeft) og bygges i app.js (Om), indstillinger.js
     (Indstillinger og guiden), sager.js (sagens dialog, Ny sag, Omdøb, Udløb, Slet sag, Gem den midlertidige sag?),
     ordbog.js (Tilføj post, Prøv på tekst, Fjern post, Start forfra) og maskering.js (Gem med de rigtige værdier?). -->
</body>
</html>
