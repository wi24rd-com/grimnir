[package]
name = "grimnir"
version = "0.1.0"
description = "Wi24rd Grimnir: maskerer følsomme værdier i logs og scripts og sætter dem tilbage bagefter"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "grimnir_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
grimnir-core = { path = "../grimnir-core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# V-SAG.1: sager på disk (D7). Nøglen pr. sag i Keychain/Credential Manager; XChaCha20-Poly1305; nulstilling i hukommelsen.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
zeroize = "1.9.1"
# V-FIL.1: styresystemets egne Åbn- og Gem-dialoger, åbnet fra Rust (ikke tauri-plugin-dialog/-fs: webvisningen får
# ingen fil-rettigheder). Uden standardfunktioner: de er kun Linux-bagender (xdg-portal, wayland), ikke Grimnirs mål.
rfd = { version = "=0.18.0", default-features = false }

# V-LAAS.2: døren ved start på macOS (LocalAuthentication, `LAContext`; src/laas.rs). Kun macOS. Den nye crate er
# objc2-local-authentication; objc2, objc2-foundation og block2 står allerede i træet i præcis disse versioner (via tauri,
# muda og rfd) og nævnes kun direkte, fordi bindingerne skal have `Bool`, `NSString`, `NSError` og `RcBlock`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSNotification", "NSOperation", "NSDate", "NSTimeZone"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# V-LAAS.3: notifikationerne om dvale, skærme og brugerskift (src/notifikationer.rs). objc2-app-kit står allerede i træet i
# præcis denne version (via muda og objc2-web-kit); her slås kun featuren NSWorkspace til (og NSNotification/NSOperation
# på objc2-foundation til addObserverForName). Ingen ny crate; målt i HANDOFF-V-LAAS.3.
# V-LAAS.4: udklipsholderen ryddes ved lås (src/udklip.rs: NSPasteboard) og den lokale tid til navnet på en midlertidig
# sag (src/klokke.rs: NSTimeZone, NSDate). Kun features på crates, der allerede står i træet; målt i HANDOFF-V-LAAS.4.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSPasteboard"] }
