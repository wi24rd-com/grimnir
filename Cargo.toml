[workspace]
members = ["grimnir-core", "src-tauri"]
resolver = "2"

# V-SAG.1 G5 (fund 2 i V-SKAL.2): debug-bundlen, Jan tester med, optimerer kernen og dens søgecrates, så analysen ikke
# er ti gange langsommere end i release. Resten af debug-bygningen er uændret (hurtig oversættelse, fejlsøgning).
[profile.dev.package.grimnir-core]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# V-RET.1 R6 (fund 4 i V-FIL.1): skallens egen kode (fil.rs læser og afkoder filerne) optimeres også i debug. Målt i
# V-RET.1: læsning af 100 MB og byggetiden for cargo test, før og efter (HANDOFF-V-RET.1.md, R6).
[profile.dev.package.grimnir]
opt-level = 2
